# =============================================================================
# Nginx конфигурация для IPTV Proxmox Stack
# =============================================================================
# Раздаёт:
#   /playlist.m3u      - проверенный плейлист (только рабочие каналы)
#   /playlist-all.m3u  - сырой плейлист от Threadfin (прокси)
#   /xmltv.xml         - EPG данные
#   /healthz           - health check endpoint
# =============================================================================

# Основной серверный блок
server {
    listen 8080;
    server_name _;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # -----------------------------------------------------------------
    # Health check endpoint
    # -----------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # -----------------------------------------------------------------
    # Проверенный плейлист (только рабочие каналы)
    # -----------------------------------------------------------------
    # Обновляется скриптом check_playlist.py каждые 15 минут
    location = /playlist.m3u {
        alias /usr/share/nginx/html/checked/playlist.m3u;
        default_type application/x-mpegURL;

        # Запрет кэширования (всегда свежий список)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # CORS для доступа из браузера
        add_header Access-Control-Allow-Origin *;
    }

    # -----------------------------------------------------------------
    # JSON отчёт о проверке каналов
    # -----------------------------------------------------------------
    location = /report.json {
        alias /usr/share/nginx/html/checked/report.json;
        default_type application/json;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # -----------------------------------------------------------------
    # Сырой плейлист от Threadfin (все каналы)
    # -----------------------------------------------------------------
    # Проксирует запрос на Threadfin контейнер
    location = /playlist-all.m3u {
        proxy_pass http://threadfin:34400/playlist.m3u8;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        default_type application/x-mpegURL;

        # Запрет кэширования
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # -----------------------------------------------------------------
    # Сырой плейлист (альтернативный путь)
    # -----------------------------------------------------------------
    location = /playlist-all.m3u8 {
        proxy_pass http://threadfin:34400/playlist.m3u8;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        default_type application/x-mpegURL;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # -----------------------------------------------------------------
    # EPG (XMLTV)
    # -----------------------------------------------------------------
    location = /xmltv.xml {
        alias /usr/share/nginx/html/epg/epg.xml;
        default_type application/xml;

        # Кэширование на 5 минут (EPG обновляется часто)
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin *;

        # Gzip сжатие для экономии трафика
        gzip on;
        gzip_types application/xml;
        gzip_min_length 1000;
    }

    # -----------------------------------------------------------------
    # EPG (альтернативный путь .gz)
    # -----------------------------------------------------------------
    location = /xmltv.xml.gz {
        alias /usr/share/nginx/html/epg/epg.xml.gz;
        default_type application/gzip;

        add_header Cache-Control "public, max-age=300";
        add_header Content-Encoding gzip;
        add_header Access-Control-Allow-Origin *;
    }

    # -----------------------------------------------------------------
    # Прокси на Threadfin (веб-интерфейс и API)
    # -----------------------------------------------------------------
    location /web {
        proxy_pass http://threadfin:34400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://threadfin:34400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------------------------
    # Запрет доступа к скрытым файлам
    # -----------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------
    # 404 для неизвестных путей
    # -----------------------------------------------------------------
    location / {
        return 404 '{"error": "not found"}\n';
        default_type application/json;
    }
}
