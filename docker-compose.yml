# =============================================================================
# IPTV Proxmox Stack - Docker Compose
# =============================================================================
# Сервисы:
#   - threadfin: IPTV прокси (управление плейлистами, EPG)
#   - epg-grabber: синхронизация EPG + проверка каналов
#   - nginx: раздача проверенных плейлистов и EPG
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Threadfin - IPTV прокси сервер
  # ---------------------------------------------------------------------------
  # Управляет плейлистами, объединяет источники, генерирует EPG
  # Веб-интерфейс доступен на порту 34400 (через SSH туннель)
  # ---------------------------------------------------------------------------
  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    restart: unless-stopped
    ports:
      - "${THREADFIN_PORT:-34400}:34400"
    volumes:
      # Конфигурация Threadfin (сохраняется между перезапусками)
      - ./data/threadfin:/home/threadfin/conf
      # Исходные плейлисты (Threadfin сохраняет сюда)
      - ./data/source:/home/threadfin/data
    environment:
      - TZ=${TZ:-Europe/Moscow}
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:34400/web"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # EPG Grabber - синхронизация EPG и проверка каналов
  # ---------------------------------------------------------------------------
  # Два процесса:
  #   1. epg-sync.sh - скачивает XMLTV EPG по расписанию
  #   2. check-playlist.sh - проверяет доступность каналов (по cron на хосте)
  # ---------------------------------------------------------------------------
  epg-grabber:
    image: alpine:3.19
    container_name: epg-grabber
    restart: unless-stopped
    volumes:
      # Скрипты
      - ./scripts:/scripts:ro
      # Данные EPG
      - ./data/epg:/data/epg
      # Проверенные плейлисты
      - ./data/checked:/data/checked
      # Исходные плейлисты (для чтения)
      - ./data/source:/data/source:ro
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - EPG_URL=${EPG_URL}
      - EPG_INTERVAL=${EPG_INTERVAL:-60}
      - CHECK_TIMEOUT=${CHECK_TIMEOUT:-5}
      - CHECK_WORKERS=${CHECK_WORKERS:-20}
    # Основной процесс - синхронизация EPG в бесконечном цикле
    command: >
      sh -c "
        apk add --no-cache bash curl wget python3 py3-pip &&
        pip3 install --no-cache-dir requests &&
        chmod +x /scripts/epg-sync.sh &&
        /scripts/epg-sync.sh
      "
    depends_on:
      threadfin:
        condition: service_healthy
    networks:
      - iptv-network

  # ---------------------------------------------------------------------------
  # Nginx - раздача плейлистов и EPG
  # ---------------------------------------------------------------------------
  # Раздаёт:
  #   /playlist.m3u      - проверенный плейлист (только рабочие каналы)
  #   /playlist-all.m3u  - сырой плейлист от Threadfin
  #   /xmltv.xml         - EPG данные
  #   /healthz           - health check endpoint
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: iptv-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      # Конфигурация Nginx
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Проверенные плейлисты
      - ./data/checked:/usr/share/nginx/html/checked:ro
      # Исходные данные Threadfin (для сырого плейлиста)
      - ./data/source:/usr/share/nginx/html/source:ro
      # EPG данные
      - ./data/epg:/usr/share/nginx/html/epg:ro
    environment:
      - TZ=${TZ:-Europe/Moscow}
    depends_on:
      threadfin:
        condition: service_healthy
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# =============================================================================
# Сети
# =============================================================================
networks:
  iptv-network:
    driver: bridge
    name: iptv-network
